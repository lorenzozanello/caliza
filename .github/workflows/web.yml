name: web

on:
  push:
    branches: [main, 'claude/**']
    paths: ['web/**', 'brand/**', 'prototype/assets/img/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'brand/**', 'prototype/assets/img/**', '.github/workflows/web.yml']

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      CI: 'true'
      DATABASE_URI: file:./caliza.db
      PAYLOAD_SECRET: ci-only-secret-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      PAYMENTS_PROVIDER: simulated
      SEED_ADMIN_EMAIL: admin@caliza.co
      SEED_ADMIN_PASSWORD: caliza-ci-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Contenido de ejemplo
        run: npm run seed
      - name: Build
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Pruebas de extremo a extremo (390 y 1440 px, axe)
        run: npm run test:e2e
      - name: Lighthouse
        run: npm run test:lhci
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            web/playwright-report
            web/test-results
            web/.lighthouseci
          retention-days: 7
