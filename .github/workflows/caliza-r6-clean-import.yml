name: CALIZA R6 — SHA-verified clean catalog import
on:
  push:
    branches:
      - feat/caliza-real-photos-editorial-v2-20261111
    paths:
      - '.qa-media/caliza-r6-clean/**'
      - 'web/scripts/import-caliza-r6-clean.py'
      - '.github/workflows/caliza-r6-clean-import.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: caliza-r6-clean-qa
  cancel-in-progress: false
jobs:
  import-clean:
    if: github.ref == 'refs/heads/feat/caliza-real-photos-editorial-v2-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/caliza-real-photos-editorial-v2-20261111
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original source crop archive; generate only safe QA media
        run: python web/scripts/import-caliza-r6-clean.py
      - name: Commit validated QA files and discard binary transfer shards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/assets/img/catalog-r6 prototype/assets/data/r6-catalog.js docs/CALIZA_R6_CLEAN_CATALOG_PROVENANCE.json
          git rm -r -q .qa-media/caliza-r6-clean
          git commit -m "build(caliza): 41 cleaned commercial reference crops as 82 responsive QA assets"
          git push origin "HEAD:feat/caliza-real-photos-editorial-v2-20261111"
