name: CALIZA authorized real media — optimize and commit QA assets
# Manual execution only: source originals are deliberately removed after successful build.
# Do not run against a source-free branch or without explicit editorial authorization.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-real-media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processor
        run: python -m pip install --disable-pip-version-check "pillow>=12,<13"
      - name: Confirm explicitly staged authorized source batch
        run: test -f media-source/caliza/source-manifest.json
      - name: Editorial image transformation
        run: python web/scripts/build-caliza-real-media.py
      - name: Source removals and optimized commit (QA only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/assets/img/approved prototype/assets/data/approved-media.js docs/CALIZA_REAL_MEDIA_PROVENANCE.json
          git rm -r -q media-source/caliza
          git commit -m "build(caliza): 11 owner-authorized source photos as responsive WebP/AVIF" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
