<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"><style>body{margin:0;background:var(--piedra)}</style></head>
<body>
<div class="cz" style="padding:28px;background:var(--piedra)">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:760px">
  <label class="cz-field" for="f1">¿A qué ciudad la enviamos?<input id="f1" value="Barranquilla"><span class="cz-field__hint" style="color:var(--exito)">Envío con instalación disponible · costo según acceso</span></label>
  <label class="cz-field" for="f2">Piso<input id="f2" value="8" inputmode="numeric"><span class="cz-field__hint">Para revisar ascensor y escaleras.</span></label>
  <label class="cz-field cz-field--error" for="f3">WhatsApp<input id="f3" value="300 12"><span class="cz-field__hint">Escribe un número de 10 dígitos para poder confirmarte.</span></label>
  <label class="cz-field" for="f4">Tipo de inmueble<select id="f4"><option>Apartamento</option><option>Casa</option></select></label>
</div>
</div>

</body>
</html>
