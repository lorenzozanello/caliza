<!-- @dsCard height=288 -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Instrument+Serif&display=swap">
<style>
  body { margin: 0; background: var(--piedra); }
  .cover { position: relative; width: 960px; height: 288px; background: var(--piedra); overflow: hidden; }
  .cover svg { position: absolute; left: 480px; top: 0; width: 480px; height: 288px; }
  .b-carbon { fill: var(--carbon); } .b-arena { fill: var(--arena); } .b-nogal { fill: var(--nogal); } .b-acento { fill: var(--acento); }
  .arc { fill: none; stroke: var(--piedra); stroke-width: 8px; }
  .text { position: absolute; left: 40px; bottom: 36px; max-width: 420px; }
  .name { font-family: var(--font-serif); font-size: 120px; line-height: .95; color: var(--carbon); letter-spacing: -.02em; }
  .tag { margin-top: 12px; font-family: var(--font-sans); font-size: 14px; color: var(--veta); }
</style>
</head>
<body>
<div class="cover">
  <svg viewBox="0 0 480 288" aria-hidden="true">
    <!-- blocks: carbon 96 + carbon 96 (section-s1), arena 24 (space-6), nogal 56 (gutter), acento 16 (space-4); full width, radius-none -->
    <!-- arrangement: horizontal strata of unequal height, like limestone cut across its layers -->
    <!-- pattern: the literal motif, concentric quarter arcs from the logo symbol, cut in the ground colour: Caliza's mark is layered arcs -->
    <!-- scales: arc radii 96/160/240 (section-s1, section-s2, section-s3), stroke 8 (space-2), square corners (radius-none) -->
    <rect class="b-carbon" x="0" y="0" width="480" height="96"/>
    <rect class="b-arena" x="0" y="96" width="480" height="24"/>
    <rect class="b-nogal" x="0" y="120" width="480" height="56"/>
    <rect class="b-acento" x="0" y="176" width="480" height="16"/>
    <rect class="b-carbon" x="0" y="192" width="480" height="96"/>
    <path class="arc" d="M 0 192 A 96 96 0 0 1 96 288"/>
    <path class="arc" d="M 0 128 A 160 160 0 0 1 160 288"/>
    <path class="arc" d="M 0 48 A 240 240 0 0 1 240 288"/>
  </svg>
  <div class="text">
    <div class="name">Caliza</div>
    <div class="tag">Piedra con criterio. Tres generaciones de marmoleros italianos.</div>
  </div>
</div>
</body>
</html>
